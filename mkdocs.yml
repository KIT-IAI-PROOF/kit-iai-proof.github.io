site_name: PROOF – PROcess Orchestration Framework
site_url: https://kit-iai-proof.github.io/
site_description: >-
  PROOF is an open-source, containerized co-simulation and scientific workflow
  orchestration framework for energy systems. Create, orchestrate and monitor
  complex workflows with the PROOF framework and its user-friendly web UI.
site_author: Karlsruhe Institute of Technology (KIT), Institute for Automation and Applied Informatics (IAI)

markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: true

theme:
  name: mkdocs
  user_color_mode_toggle: true
  features:
    - navigation.expand
    - navigation.path
    - toc.follow
    - navigation.top
    - search
    - search.suggest
    - search.highlight

  #  - navigation.sections
  #include_sidebar: true



nav:
  - Getting Started:
    - Installation & Setup: GettingStarted/installation.md
    - Tutorial & Demo Workflows: GettingStarted/tutorial.md
  - Workflows:
    - Workflow Structure: Workflow/proof-workflows.md
    - Creating Workflows: UI/creating-workflows.md
    - Monitoring Workflows: Workflow/monitoring-executions.md
  - Blocks:
    - Introduction: Block/overview.md
    - Using Blocks: UI/using-proof-blocks.md
    - Creating new Templates: Block/creating-new-templates.md
    #- Changing Blocks: Block/using-proof-blocks.md
  #- Program: Program/proof-programs.md
    #- Overview: Program/proof-programs.md 
  - UI:
    - Creating Workflows: UI/creating-workflows.md
    - Monitoring: Workflow/monitoring-executions.md
    - Configuration: UI/configs.md
  - FAQ: faq.md
  - About:
    - About: About/about.md
    - Release Notes: About/release-notes.md

copyright: (c) 2025-2026 Karlsruhe Institute of Technology (KIT), Institute for Automation and Applied Informatics (IAI)
